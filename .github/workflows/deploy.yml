name: Deploy current school project
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Package public preview only
        run: |
          mkdir -p 배포자료/결과물/미리보기 배포자료/모델 배포자료/공간자료
          cp index.html 배포자료/
          cp -R 웹학교 배포자료/웹학교
          cp 결과물/미리보기/campus-*.png 배포자료/결과물/미리보기/
          cp 모델/school_master.blend 배포자료/모델/
          cp 공간자료/*.csv 배포자료/공간자료/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 배포자료
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
