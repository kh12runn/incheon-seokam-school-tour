name: Deploy current school project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Package public preview only
        run: |
          mkdir -p public-site/exports/renders public-site/blender public-site/data
          cp index.html public-site/
          cp exports/renders/campus-*.png public-site/exports/renders/
          cp blender/school_master.blend public-site/blender/
          cp data/*.csv public-site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
