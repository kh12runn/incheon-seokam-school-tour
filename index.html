<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123c56" />
    <link rel="icon" href="assets/logo.png" />
    <meta
      name="description"
      content="인천석암초등학교의 교내 공간을 둘러보는 360도 가상학교입니다."
    />
    <title>석암초 가상학교</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#panorama">360도 화면으로 바로가기</a>

    <main class="tour-shell">
      <div id="viewer-wrap" class="viewer-wrap">
        <div id="panorama" aria-label="360도 가상학교 화면"></div>
        <div id="scene-fade" class="scene-fade" aria-hidden="true"></div>

        <header class="topbar">
          <div class="brand">
            <img src="assets/logo.png" alt="" class="brand-logo" />
            <div>
              <span class="brand-school">인천석암초등학교</span>
              <h1>석암초 가상학교</h1>
            </div>
          </div>
          <div class="top-actions">
            <button id="map-toggle" class="icon-button map-toggle" type="button" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 6 5-3 8 3 5-3v15l-5 3-8-3-5 3V6Zm5-3v15m8-12v15" />
              </svg>
              <span class="button-text">배치도</span>
            </button>
            <button
              id="menu-toggle"
              class="icon-button menu-toggle"
              type="button"
              aria-controls="place-panel"
              aria-expanded="true"
            >
              <span class="menu-lines" aria-hidden="true"></span>
              <span class="button-text">장소</span>
            </button>
          </div>
        </header>

        <section class="location-card" aria-live="polite">
          <span>현재 위치</span>
          <strong id="current-location">불러오는 중...</strong>
        </section>

        <nav id="floor-nav" class="floor-nav" aria-label="층별 빠른 이동"></nav>

        <div class="viewer-help" id="viewer-help">
          <span aria-hidden="true">↔</span>
          드래그해서 둘러보세요
          <button id="help-close" type="button" aria-label="안내 닫기">×</button>
        </div>

        <div id="viewer-error" class="viewer-error" hidden>
          <strong>360도 화면을 불러오지 못했습니다.</strong>
          <p>인터넷 연결을 확인한 뒤 페이지를 새로고침해 주세요.</p>
        </div>
      </div>

      <aside id="place-panel" class="place-panel" aria-label="학교 장소 메뉴">
        <div class="panel-head">
          <div>
            <span>둘러보기</span>
            <h2>학교 장소</h2>
          </div>
          <button id="panel-close" class="panel-close" type="button" aria-label="장소 메뉴 닫기">×</button>
        </div>
        <p class="sample-notice">현재 화면은 기능 확인을 위한 샘플 공간입니다.</p>
        <div id="place-list" class="place-list"></div>
        <footer class="panel-footer">
          <span class="legend-icon move" aria-hidden="true">➜</span> 이동
          <span class="legend-icon info" aria-hidden="true">i</span> 안내
        </footer>
      </aside>

      <button id="panel-backdrop" class="panel-backdrop" type="button" aria-label="장소 메뉴 닫기"></button>
    </main>

    <dialog id="info-modal" class="info-modal" aria-labelledby="info-title">
      <button id="modal-close" class="modal-close" type="button" aria-label="팝업 닫기">×</button>
      <div id="info-media" class="info-media"></div>
      <div class="modal-copy">
        <span class="modal-eyebrow">공간 안내</span>
        <h2 id="info-title"></h2>
        <p id="info-text"></p>
        <a id="info-link" class="info-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
          자세히 보기 <span aria-hidden="true">↗</span>
        </a>
      </div>
    </dialog>

    <dialog id="map-modal" class="map-modal" aria-labelledby="map-title">
      <header class="map-head">
        <div>
          <span class="modal-eyebrow">학교 공간 안내</span>
          <h2 id="map-title">디지털 배치도</h2>
          <p>교실을 누르면 사진이 준비된 위치로 이동합니다.</p>
        </div>
        <button id="map-close" class="modal-close map-close" type="button" aria-label="배치도 닫기">×</button>
      </header>
      <nav id="map-floor-tabs" class="map-floor-tabs" aria-label="배치도 층 선택"></nav>
      <section class="map-canvas-wrap" aria-live="polite">
        <div class="map-caption">
          <strong id="map-floor-title">본관 1층</strong>
          <span id="map-floor-note">공간 관계를 단순화한 배치도입니다.</span>
        </div>
        <div class="map-scroll">
          <svg id="school-map" class="school-map" role="img" aria-label="학교 공간 배치도"></svg>
        </div>
      </section>
      <footer class="map-legend">
        <span><i class="legend-current"></i> 현재 위치</span>
        <span><i class="legend-sample"></i> 샘플 사진</span>
        <span><i class="legend-ready"></i> 실제 사진</span>
        <span><i class="legend-pending"></i> 촬영 예정</span>
      </footer>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="js/school-layout.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
